<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSD NOTES</title>
    <link rel="stylesheet" href="STYLE/index.css">
</head>
<body>
    <div class="fullscreen">
        <h1>MSD NOTES <br> please use a mobile phone</h1>
    </div>
   <div class="smallscreen">
    <div class="top-header">
        <h1>MSD NOTES <br> <span id="dayoftheweek">Monday</span>:<span id="date">09/10/2026</span>,<span id="time">12:00 PM</span></h1>
    </div>
    <div class="main">
        <div class="hero">
            <ul class="hero-list">
                <button id="add-notes" class="add-note">
                   add note
                </button>
            </ul>
        </div>
    </div>
    </div>
    <div class="footer">
        <p>MSD NOTES &copy; 2026</p>
    </div>

    <!-- Add / Edit Note Modal Popup -->
    <div id="note-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Add Note</h2>
            <div class="input-group">
                <label for="note-title-input">Title</label>
                <input type="text" id="note-title-input" placeholder="Note title..." />
            </div>
            <div class="input-group">
                <div class="input-label-row">
                    <label for="note-body-input">Content</label>
                    <div class="modal-toolbar">
                        <button type="button" id="insert-numbered-list-btn" class="toolbar-btn" title="Add numbered list item">1. List</button>
                        <button type="button" id="insert-bullet-list-btn" class="toolbar-btn" title="Add bullet list item">• Bullet</button>
                    </div>
                </div>
                <textarea id="note-body-input" placeholder="Type your note here..." rows="5"></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" id="close-modal-btn">Cancel</button>
                <button type="button" id="save-note-btn">Save Note</button>
            </div>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script/index.js"></script>
</body>
</html>
